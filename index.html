<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עורך חדר בריחה דיגיטלי - מורה</title>
    
    <!-- ספריות עיצוב ופונטים -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Assistant', sans-serif; background-color: #0b1120; color: #e2e8f0; overflow: hidden; }
        .theme-font { font-family: 'Courier New', Courier, monospace; letter-spacing: -0.5px; } 
        
        @keyframes pulse-border { 0% { box-shadow: 0 0 0 0 rgba(6, 182, 212, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(6, 182, 212, 0); } 100% { box-shadow: 0 0 0 0 rgba(6, 182, 212, 0); } }
        .active-level { border-color: #06b6d4; background-color: #1e293b; animation: pulse-border 2s infinite; }

        /* אזורים חמים */
        .hotspot-edit { border: 3px solid #06b6d4; background: rgba(6, 182, 212, 0.2); box-shadow: 0 0 10px rgba(6,182,212,0.5); z-index: 10; cursor: crosshair; pointer-events: none; }
        .hotspot-play { border: 3px solid transparent; z-index: 10; cursor: pointer; transition: all 0.3s; }
        .hotspot-play:hover { border-color: rgba(6, 182, 212, 0.5); background: rgba(6, 182, 212, 0.1); }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0b1120; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #0ea5e9; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #0284c7; }

        /* עיבוד גודל תמונה למניעת חיתוך ופרופורציות נכונות */
        .image-display-area {
            position: relative;
            display: inline-block;
            max-width: 100%;
        }
        
        #teacher-image {
            max-width: 100%;
            max-height: calc(100vh - 380px);
            object-fit: contain;
            display: block;
        }

        /* תצוגה מקדימה במסך מלא */
        #preview-image {
            max-width: 100vw;
            max-height: 90vh;
            object-fit: contain;
            display: block;
        }

        .type-pill { transition: all 0.2s; cursor: pointer; border: 1px solid #334155; opacity: 0.6; }
        .type-pill.active { opacity: 1; border-color: #06b6d4; background-color: rgba(6, 182, 212, 0.1); }
    </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden text-white">

    <!-- מסך עריכה (מורה) -->
    <div id="screen-teacher" class="flex-1 flex flex-col bg-[#0b1120] overflow-hidden h-screen">
        <header class="bg-slate-900 p-4 border-b border-slate-800 flex justify-between items-center shadow-lg z-30 shrink-0">
            <h1 class="text-2xl font-bold text-cyan-400 theme-font flex items-center gap-3">
                <i class="fas fa-database text-cyan-600"></i> עורך חדר בריחה
            </h1>
            <div class="flex gap-3 items-center">
                <label class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-cyan-300 px-4 py-2 rounded-lg cursor-pointer transition flex items-center gap-2 text-sm shadow-md">
                    <i class="fas fa-folder-open"></i> טעינת משחק
                    <input type="file" class="hidden" accept=".json" onchange="handleLoadGame(event)">
                </label>
                <div class="w-px h-6 bg-slate-700 mx-2"></div>
                <button onclick="previewGame()" class="bg-indigo-600 hover:bg-indigo-500 border border-indigo-400 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition text-sm shadow-md">
                    <i class="fas fa-expand"></i> תצוגה מקדימה
                </button>
                <button onclick="saveProjectFile()" class="bg-cyan-700 hover:bg-cyan-600 border border-cyan-500 text-white px-6 py-2 rounded-lg flex items-center gap-2 transition text-sm font-bold shadow-lg text-center">
                    <i class="fas fa-save"></i> שמירה (JSON)
                </button>
            </div>
        </header>

        <div class="flex-1 flex overflow-hidden min-h-0">
            <aside class="w-72 bg-slate-900 border-l border-slate-800 p-4 flex flex-col gap-4 z-20 shrink-0 h-full overflow-hidden text-center">
                <div class="flex justify-between items-center mb-2 shrink-0">
                    <h2 class="font-bold text-lg text-slate-300 uppercase tracking-widest text-sm text-center">שלבי החדר</h2>
                    <label class="bg-cyan-700 hover:bg-cyan-600 border border-cyan-500 w-8 h-8 rounded-full cursor-pointer flex items-center justify-center text-white transition hover:scale-110" title="הוספת שלב חדש">
                        <i class="fas fa-plus"></i>
                        <input type="file" class="hidden" accept="image/*" onchange="addLevelFromFile(event)">
                    </label>
                </div>
                <div id="teacher-sidebar-levels" class="space-y-4 overflow-y-auto flex-1 pr-2 pb-10 min-h-0"></div>
            </aside>

            <main class="flex-1 overflow-y-auto p-4 bg-[#0b1120] shadow-inner flex flex-col items-center justify-center">
                
                <div id="empty-state" class="text-center text-slate-500 hidden flex-col items-center justify-center">
                    <i class="fas fa-image text-6xl mb-4 opacity-50"></i>
                    <h2 class="text-2xl font-bold mb-2">אין שלבים בחדר</h2>
                    <p class="mb-6">התחילו על ידי העלאת תמונה לשלב הראשון או טענו קובץ משחק קיים.</p>
                    <label class="bg-cyan-700 hover:bg-cyan-600 border border-cyan-500 text-white px-8 py-3 rounded-xl font-bold cursor-pointer transition shadow-lg inline-block">
                        יצירת שלב ראשון
                        <input type="file" class="hidden" accept="image/*" onchange="addLevelFromFile(event)">
                    </label>
                </div>

                <div id="teacher-main-content" class="max-w-5xl mx-auto flex-1 flex flex-col items-center gap-4 w-full hidden">
                    
                    <div id="teacher-type-selector" class="w-full flex justify-center gap-4 bg-slate-900/50 p-2 rounded-2xl border border-slate-800 shrink-0">
                        <div onclick="setLevelType('intro')" id="type-intro" class="type-pill px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2">
                            <i class="fas fa-door-open"></i> תמונת פתיחה
                        </div>
                        <div onclick="setLevelType('puzzle')" id="type-puzzle" class="type-pill px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2">
                            <i class="fas fa-puzzle-piece"></i> חידת קוד
                        </div>
                        <div onclick="setLevelType('end')" id="type-end" class="type-pill px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2">
                            <i class="fas fa-flag-checkered"></i> תמונת סיום
                        </div>
                    </div>

                    <div class="flex-1 flex items-center justify-center w-full bg-black/40 rounded-xl overflow-visible relative">
                        <div id="teacher-image-wrapper" class="image-display-area shadow-2xl" onmousedown="startHotspotDraw(event)" onmousemove="updateHotspotDraw(event)">
                            <img id="teacher-image" src="" draggable="false" class="opacity-95 pointer-events-none select-none border-2 border-slate-700 rounded-xl">
                            <div id="teacher-hotspot" class="absolute hotspot-edit"></div>
                            
                            <div id="teacher-hotspot-hint" class="absolute -top-10 left-1/2 transform -translate-x-1/2 bg-black/80 px-4 py-1 rounded-lg text-xs font-bold border border-cyan-500/50 text-cyan-300 theme-font whitespace-nowrap">סמנו מלבן על התמונה</div>
                            
                            <label class="absolute top-4 left-4 z-50 bg-indigo-600/90 hover:bg-indigo-500 px-3 py-1.5 rounded-lg text-xs font-bold border border-indigo-400 text-white shadow-lg cursor-pointer transition flex items-center gap-2">
                                <i class="fas fa-sync-alt"></i> החלפת תמונה
                                <input type="file" class="hidden" accept="image/*" onchange="replaceImageFromFile(event)">
                            </label>
                        </div>
                    </div>

                    <div id="teacher-edit-panel" class="w-full bg-slate-900/80 p-5 rounded-xl border border-slate-700 grid grid-cols-2 gap-4 shadow-xl shrink-0 backdrop-blur-sm">
                        <div class="flex flex-col gap-1">
                            <label class="text-[10px] font-bold text-cyan-500 uppercase tracking-widest flex items-center gap-2">שאלה:</label>
                            <textarea id="teacher-input-question" rows="2" class="bg-[#0b1120] border border-slate-700 rounded-lg px-4 py-2 text-slate-200 focus:outline-none resize-none text-sm"></textarea>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-[10px] font-bold text-cyan-500 uppercase tracking-widest flex items-center gap-2">תשובה:</label>
                            <input id="teacher-input-answer" type="text" class="bg-[#0b1120] border border-slate-700 rounded-lg px-4 py-2 text-cyan-300 h-full focus:ring-1 focus:ring-cyan-500 theme-font text-base">
                        </div>
                    </div>
                    
                    <div id="teacher-nav-msg" class="hidden w-full bg-indigo-900/40 p-3 rounded-xl border border-indigo-700 text-center shadow-xl shrink-0 backdrop-blur-sm">
                        <p id="nav-msg-text" class="text-indigo-200 font-bold tracking-widest text-center text-xs"></p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- מודאל תצוגה מקדימה -->
    <div id="modal-preview" class="hidden fixed inset-0 z-[100] flex flex-col items-center justify-center p-4 bg-black/95 backdrop-blur-md">
        <button onclick="closePreview()" class="absolute top-6 left-6 text-slate-400 hover:text-white transition text-4xl z-[110]">
            <i class="fas fa-times"></i>
        </button>
        <p class="absolute top-6 right-6 text-cyan-400 theme-font tracking-widest text-xl font-bold">תצוגה מקדימה (תלמיד)</p>
        
        <div class="image-display-area group mt-10">
            <img id="preview-image" src="" draggable="false" class="shadow-[0_0_50px_rgba(0,0,0,0.9)] border-2 border-slate-700 rounded-xl select-none pointer-events-none">
            <!-- מלבן הלחיצה יוצג עם אפקט ריחוף כפי שהתלמיד יראה אותו -->
            <div id="preview-hotspot" class="absolute hotspot-play"></div>
        </div>
    </div>

    <script>
        let levels = [];
        let currentLevelIndex = 0;
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };

        const teacherDOM = {
            sidebar: document.getElementById('teacher-sidebar-levels'),
            mainContent: document.getElementById('teacher-main-content'),
            emptyState: document.getElementById('empty-state'),
            img: document.getElementById('teacher-image'),
            hotspot: document.getElementById('teacher-hotspot'),
            inputQ: document.getElementById('teacher-input-question'),
            inputA: document.getElementById('teacher-input-answer'),
            editPanel: document.getElementById('teacher-edit-panel'),
            navMsg: document.getElementById('teacher-nav-msg'),
            navText: document.getElementById('nav-msg-text')
        };

        const previewDOM = {
            modal: document.getElementById('modal-preview'),
            img: document.getElementById('preview-image'),
            hotspot: document.getElementById('preview-hotspot')
        };

        function setLevelType(type) {
            if (!levels[currentLevelIndex]) return;
            levels[currentLevelIndex].type = type;
            renderTeacherUI();
        }

        function handleLoadGame(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    let data = JSON.parse(e.target.result);
                    let parsedLevels = Array.isArray(data) ? data : (data.levels || []);
                    if (!parsedLevels || parsedLevels.length === 0) throw new Error("No levels");
                    
                    levels = parsedLevels.map(l => ({
                        ...l, 
                        type: l.type || 'puzzle',
                        hotspot: l.hotspot || { x: 40, y: 40, width: 20, height: 20 }
                    }));
                    
                    currentLevelIndex = 0;
                    renderTeacherUI();
                } catch (err) { 
                    alert("שגיאה: קובץ המשחק לא תקין או פגום."); 
                }
                event.target.value = ''; 
            };
            reader.readAsText(file);
        }

        function startHotspotDraw(e) {
            if(!levels[currentLevelIndex]) return;
            e.preventDefault();
            const rect = teacherDOM.img.getBoundingClientRect();
            dragStart.x = ((e.clientX - rect.left) / rect.width) * 100;
            dragStart.y = ((e.clientY - rect.top) / rect.height) * 100;
            isDragging = true;
            levels[currentLevelIndex].hotspot = { x: dragStart.x, y: dragStart.y, width: 0, height: 0 };
            updateHotspotVisual(teacherDOM.hotspot, levels[currentLevelIndex].hotspot);
        }

        function updateHotspotDraw(e) {
            if(!isDragging) return;
            const rect = teacherDOM.img.getBoundingClientRect();
            const curX = ((e.clientX - rect.left) / rect.width) * 100;
            const curY = ((e.clientY - rect.top) / rect.height) * 100;
            const x = Math.max(0, Math.min(100, Math.min(dragStart.x, curX)));
            const y = Math.max(0, Math.min(100, Math.min(dragStart.y, curY)));
            levels[currentLevelIndex].hotspot = { 
                x: x, y: y,
                width: Math.min(Math.abs(curX - dragStart.x), 100 - x),
                height: Math.min(Math.abs(curY - dragStart.y), 100 - y)
            };
            updateHotspotVisual(teacherDOM.hotspot, levels[currentLevelIndex].hotspot);
        }
        window.onmouseup = () => isDragging = false;

        async function processImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1920; const MAX_HEIGHT = 1080;
                        let width = img.width, height = img.height;
                        if (width > height) { if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } }
                        else { if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.85));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function replaceImageFromFile(event) {
            const file = event.target.files[0];
            if (!file || !levels[currentLevelIndex]) return;
            const imgData = await processImage(file);
            levels[currentLevelIndex].image = imgData;
            renderTeacherUI();
            event.target.value = '';
        }

        async function addLevelFromFile(event) {
            const file = event.target.files ? event.target.files[0] : event;
            if (!file) return;
            const imgData = await processImage(file);
            const newLevel = {
                id: Date.now(),
                image: imgData,
                type: 'puzzle', 
                question: 'מהו הקוד למנעול?',
                answer: '',
                hotspot: { x: 40, y: 40, width: 20, height: 20 }
            };
            if (levels.length === 0) { levels.push(newLevel); currentLevelIndex = 0; }
            else { levels.splice(currentLevelIndex + 1, 0, newLevel); currentLevelIndex++; }
            renderTeacherUI();
            if(event.target) event.target.value = '';
        }

        function removeLevel(index) {
            // Using a simple message box to confirm deletion instead of native confirm()
            const confirmMsgBox = document.createElement('div');
            confirmMsgBox.className = 'fixed inset-0 z-[200] flex items-center justify-center bg-black/80 backdrop-blur-sm';
            confirmMsgBox.innerHTML = `
                <div class="bg-slate-900 border border-cyan-500 rounded-xl p-6 text-center max-w-sm w-full mx-4 shadow-2xl">
                    <h3 class="text-xl font-bold text-cyan-400 mb-4 theme-font">מחיקת שלב</h3>
                    <p class="text-slate-300 mb-6">האם אתם בטוחים שברצונכם למחוק את השלב הזה?</p>
                    <div class="flex gap-4 justify-center">
                        <button id="btn-confirm-delete" class="bg-red-600 hover:bg-red-500 text-white px-6 py-2 rounded-lg font-bold transition">כן, מחק</button>
                        <button id="btn-cancel-delete" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-6 py-2 rounded-lg transition">ביטול</button>
                    </div>
                </div>
            `;
            document.body.appendChild(confirmMsgBox);

            document.getElementById('btn-confirm-delete').onclick = () => {
                levels.splice(index, 1);
                if (currentLevelIndex >= levels.length && levels.length > 0) currentLevelIndex = levels.length - 1;
                renderTeacherUI();
                document.body.removeChild(confirmMsgBox);
            };

            document.getElementById('btn-cancel-delete').onclick = () => {
                document.body.removeChild(confirmMsgBox);
            };
        }

        function saveProjectFile() {
            if (levels.length === 0) {
                 const alertMsgBox = document.createElement('div');
                 alertMsgBox.className = 'fixed inset-0 z-[200] flex items-center justify-center bg-black/80 backdrop-blur-sm';
                 alertMsgBox.innerHTML = `
                     <div class="bg-slate-900 border border-red-500 rounded-xl p-6 text-center max-w-sm w-full mx-4 shadow-2xl">
                         <h3 class="text-xl font-bold text-red-400 mb-4 theme-font">שגיאה</h3>
                         <p class="text-slate-300 mb-6">אין שלבים לשמירה. הוסיפו שלבים לפני השמירה.</p>
                         <button id="btn-close-alert" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-6 py-2 rounded-lg transition">סגור</button>
                     </div>
                 `;
                 document.body.appendChild(alertMsgBox);
                 document.getElementById('btn-close-alert').onclick = () => document.body.removeChild(alertMsgBox);
                return;
            }
            const blob = new Blob([JSON.stringify(levels)], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'escape-room.json';
            link.click();
        }

        function updateHotspotVisual(el, data) {
            if (!el || !data) return;
            el.style.top = data.y + "%"; el.style.left = data.x + "%";
            el.style.width = data.width + "%"; el.style.height = data.height + "%";
        }

        function renderTeacherUI() {
            if (levels.length === 0) {
                teacherDOM.mainContent.classList.add('hidden');
                teacherDOM.emptyState.classList.remove('hidden');
                teacherDOM.emptyState.classList.add('flex');
                teacherDOM.sidebar.innerHTML = '';
                return;
            }
            
            teacherDOM.emptyState.classList.add('hidden');
            teacherDOM.emptyState.classList.remove('flex');
            teacherDOM.mainContent.classList.remove('hidden');
            
            teacherDOM.sidebar.innerHTML = '';
            levels.forEach((lvl, idx) => {
                const div = document.createElement('div');
                div.className = `group relative p-2 rounded-xl border border-slate-700 cursor-pointer transition-all ${currentLevelIndex === idx ? 'active-level' : 'bg-slate-800'}`;
                div.onclick = () => { currentLevelIndex = idx; renderTeacherUI(); };
                
                let typeIcon = lvl.type === 'intro' ? 'fa-door-open text-indigo-400' : (lvl.type === 'end' ? 'fa-flag-checkered text-green-400' : 'fa-puzzle-piece text-cyan-200');
                
                div.innerHTML = `<img src="${lvl.image}" class="w-full h-16 object-cover rounded-md mb-1">
                    <div class="text-[10px] font-bold flex items-center justify-center gap-1 uppercase tracking-tighter text-center">
                        <i class="fas ${typeIcon}"></i> <span>שלב ${idx + 1}</span>
                    </div>
                    <button onclick="event.stopPropagation(); removeLevel(${idx})" class="absolute top-3 left-3 bg-red-600 p-1.5 rounded-md opacity-0 group-hover:opacity-100 transition hover:bg-red-500"><i class="fas fa-trash text-xs text-white"></i></button>`;
                teacherDOM.sidebar.appendChild(div);
            });

            const current = levels[currentLevelIndex];
            if (!current) return;
            
            teacherDOM.img.src = current.image;
            
            document.querySelectorAll('.type-pill').forEach(p => { if (p) p.classList.remove('active'); });
            const activePill = document.getElementById(`type-${current.type}`);
            if (activePill) activePill.classList.add('active');

            if (teacherDOM.hotspot) { 
                updateHotspotVisual(teacherDOM.hotspot, current.hotspot); 
            }

            if (current.type === 'puzzle') {
                teacherDOM.editPanel.classList.remove('hidden');
                teacherDOM.navMsg.classList.add('hidden');
                teacherDOM.inputQ.value = current.question || "";
                teacherDOM.inputA.value = current.answer || "";
            } else {
                teacherDOM.editPanel.classList.add('hidden');
                teacherDOM.navMsg.classList.remove('hidden');
                teacherDOM.navText.innerHTML = current.type === 'intro' 
                    ? '<i class="fas fa-info-circle ml-2 text-indigo-400"></i> תמונת פתיחה - סמנו מלבן שקוף כדי לאפשר לתלמיד מעבר לשלב הבא.'
                    : '<i class="fas fa-flag-checkered ml-2 text-green-400"></i> תמונת סיום - סמנו מלבן שקוף לסיום חדר הבריחה.';
            }
        }

        // תצוגה מקדימה במסך מלא
        function previewGame() {
            if (levels.length === 0 || !levels[currentLevelIndex]) {
                 const alertMsgBox = document.createElement('div');
                 alertMsgBox.className = 'fixed inset-0 z-[200] flex items-center justify-center bg-black/80 backdrop-blur-sm';
                 alertMsgBox.innerHTML = `
                     <div class="bg-slate-900 border border-red-500 rounded-xl p-6 text-center max-w-sm w-full mx-4 shadow-2xl">
                         <h3 class="text-xl font-bold text-red-400 mb-4 theme-font">שגיאה</h3>
                         <p class="text-slate-300 mb-6">יש להוסיף שלב לפני צפייה בתצוגה המקדימה.</p>
                         <button id="btn-close-preview-alert" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-6 py-2 rounded-lg transition">סגור</button>
                     </div>
                 `;
                 document.body.appendChild(alertMsgBox);
                 document.getElementById('btn-close-preview-alert').onclick = () => document.body.removeChild(alertMsgBox);
                return;
            }
            const current = levels[currentLevelIndex];
            
            previewDOM.img.src = current.image;
            updateHotspotVisual(previewDOM.hotspot, current.hotspot);
            
            previewDOM.modal.classList.remove('hidden');
        }

        function closePreview() {
            previewDOM.modal.classList.add('hidden');
            previewDOM.img.src = '';
        }

        // חיבור אירועי הקלדה לעדכון המערך
        teacherDOM.inputQ.oninput = (e) => { if (levels[currentLevelIndex]) levels[currentLevelIndex].question = e.target.value; };
        teacherDOM.inputA.oninput = (e) => { if (levels[currentLevelIndex]) levels[currentLevelIndex].answer = e.target.value; };

        // הפעלה ראשונית של הממשק
        renderTeacherUI();
    </script>
</body>
</html>
